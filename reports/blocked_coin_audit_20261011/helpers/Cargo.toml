[package]
name = "blocked-source-candidates"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blocked-source-candidates"
path = "main.rs"

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-sdk = "2.1.0"
spl-token = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
spl-token-2022 = { version = "6.0.0", default-features = false, features = ["no-entrypoint", "zk-ops"] }

[workspace]
